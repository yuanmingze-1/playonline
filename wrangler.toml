name = "playonline"
main = "_worker.js"
compatibility_date = "2024-11-01"

# 把 index.html 等静态文件交给 Worker 的 ASSETS 绑定（前端页面）
[assets]
directory = "."
binding = "ASSETS"
html_handling = "serve-index"

# 实时同步用的 Durable Object
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]
